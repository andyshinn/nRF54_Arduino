name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Take the newest changelog section as release notes
        run: awk '/^## /{n++} n==1' changelog.md > notes.md

      - uses: softprops/action-gh-release@v3
        with:
          body_path: notes.md
