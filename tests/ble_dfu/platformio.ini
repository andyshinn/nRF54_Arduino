; Link test for the BLE OTA DFU service.
;
; tests/blink covers the core and the variant pin map but never links
; Bluefruit54Lib's BLEDfu, which is the only consumer of the
; __bootloader_addr linker symbol. A mismatch there is a link error that
; no other build in this repo would surface.
;
; The CI workflow at .github/workflows/githubci.yml runs this for each
; matrix board alongside tests/blink. Local builds work too:
;
;   pio run -d tests/ble_dfu -e xiao_nrf54lm20a

[platformio]
default_envs = xiao_nrf54l15, xiao_nrf54l15_sense, nrf54l15dk, nrf54l10dk, nrf54l05dk, xiao_nrf54lm20a

[env]
platform = https://github.com/caveman99/platform-nordicnrf54.git
framework = arduino
; Force PlatformIO to use *this* checkout of the framework rather than
; cloning the published one. Path is relative to the project dir
; (tests/ble_dfu/), so ../.. is the repo root.
platform_packages =
    framework-arduinoadafruitnrf54 @ symlink://../..

[env:xiao_nrf54l15]
board = xiao_nrf54l15

[env:xiao_nrf54l15_sense]
board = xiao_nrf54l15_sense

[env:nrf54l15dk]
board = nrf54l15dk

[env:nrf54l10dk]
board = nrf54l10dk

[env:nrf54l05dk]
board = nrf54l05dk

[env:xiao_nrf54lm20a]
board = xiao_nrf54lm20a
